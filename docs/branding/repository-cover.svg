    <path d="m955 360 6 6 6-6" fill="none" stroke="#679e8f" stroke-width="2"/>

    <rect x="726" y="414" width="470" height="152" rx="16" fill="#ffffff" stroke="#c9dfd5"/>
    <text x="747" y="443" font-size="17" font-weight="600" fill="#58736a">Графики цвета и яркости</text>
