    <text x="743" y="336" font-size="18" font-weight="600" fill="#45645b">Исходник</text>

    <rect x="974" y="166" width="222" height="218" rx="16" fill="#d4e7de"/>
    <rect x="974" y="161" width="222" height="218" rx="16" fill="#ffffff" stroke="#9fcbbd"/>
    <use href="#landscape" x="989" y="176"/>
    <rect x="989" y="176" width="192" height="156" rx="8" fill="url(#pixels)"/>
    <text x="991" y="361" font-size="18" font-weight="600" fill="#45645b">Вариант</text>
