<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Image Format Lab — изучение и сравнение форматов изображений</title>
  <desc id="description">Собственный значок «Кадры», два условных изображения и схематичные кривые. Один HTML-файл, работа без интернета. Это иллюстрация, а не снимок интерфейса или результат измерений.</desc>
  <!-- Original project artwork. Project MIT license.
       The Frames mark below preserves the geometry of src/favicon.svg.
       No external assets, embedded fonts, scripts or network references. -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fcfdfb"/>
      <stop offset="1" stop-color="#edf6f2"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d5eee6"/>
      <stop offset="1" stop-color="#eff6dd"/>
    </linearGradient>
    <pattern id="pixels" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0V14" fill="none" stroke="#fcfdfb" stroke-width="0.7" opacity="0.3"/>
    </pattern>
    <g id="landscape">
      <rect width="192" height="156" rx="8" fill="url(#sky)"/>
      <rect x="144" y="26" width="20" height="20" fill="#efbd6a"/>
      <path d="M0 130 62 64 118 123 148 91 192 137V156H0Z" fill="#92cabc"/>
      <path d="M0 145 62 92 120 149 157 125 192 150V156H0Z" fill="#0f766e"/>
    </g>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <path d="M675 0H1280V640H1031Z" fill="#dceee7" opacity="0.42"/>
  <rect x="0" y="0" width="1280" height="8" fill="#0f766e"/>

  <!-- Selected project mark: unchanged paths, rectangles and square sun. -->
  <g transform="translate(64 56) scale(2)">
    <rect width="32" height="32" rx="7" fill="#0f766e"/>
    <rect x="4" y="5" width="18" height="17" rx="2" fill="#99e0cf"/>
    <rect x="6" y="7" width="14" height="13" rx="0" fill="#0f766e"/>
    <rect x="9" y="10" width="19" height="18" rx="2" fill="#0f766e"/>
    <rect x="10" y="11" width="18" height="17" rx="2" fill="#ffffff"/>
    <rect x="12" y="13" width="14" height="13" rx="0" fill="#0f766e"/>
    <rect x="22" y="15" width="2" height="2" rx="0" fill="#ffffff"/>
    <polygon points="12,26 12,22 16,18 20,22 23,20 26,23 26,26" fill="#ffffff"/>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="148" y="83" font-size="19" font-weight="600" fill="#365d55">КАЧЕСТВО</text>
    <text x="148" y="110" font-size="19" letter-spacing="0.3" fill="#647a72">ЦВЕТ · РАЗМЕР · ФОРМАТ</text>
    <text x="60" y="235" font-size="82" font-weight="700" letter-spacing="-2.2" fill="#153c35">Image</text>
    <text x="60" y="325" font-size="82" font-weight="700" letter-spacing="-2.2" fill="#153c35">Format Lab</text>
    <text x="64" y="388" font-size="30" fill="#45645b">Изучение и сравнение</text>
    <text x="64" y="428" font-size="30" fill="#45645b">форматов изображений</text>

    <rect x="64" y="474" width="163" height="44" rx="12" fill="#0f766e"/>
    <text x="145.5" y="503" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">Один HTML</text>
    <rect x="239" y="474" width="203" height="44" rx="12" fill="#e3eee8"/>
    <text x="340.5" y="503" font-size="21" font-weight="600" fill="#365d55" text-anchor="middle">Без интернета</text>
    <text x="64" y="582" font-size="22" fill="#567068">Сравнение · Анализ · Конвертация</text>

    <text x="726" y="115" font-size="18" font-weight="600" letter-spacing="1.5" fill="#55736a">ОДИН ИСХОДНИК. РАЗНЫЕ ВАРИАНТЫ.</text>
    <rect x="726" y="141" width="222" height="218" rx="16" fill="#d4e7de"/>
