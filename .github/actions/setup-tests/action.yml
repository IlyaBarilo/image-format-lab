name: Set up test tools
description: Install fixed build and browser test dependencies on a GitHub runner
inputs:
  browsers:
    description: Required engines; empty skips all Playwright installation
    default: chromium
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24.16.0'
        package-manager-cache: false
        cache: npm
        cache-dependency-path: |
          scripts/package-lock.json
          .github/actions/setup-tests/action.yml
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: scripts/ci-requirements.txt
    - name: Install build and Python tools
      shell: bash
      run: |
        npm ci --prefix scripts
        python -m pip install -r scripts/ci-requirements.txt
    - name: Install browser test tools
      if: inputs.browsers != ''
      shell: bash
      env:
        TEST_BROWSERS: ${{ inputs.browsers }}
      run: |
        case "$TEST_BROWSERS" in
          chromium|firefox|"chromium firefox") ;;
          *) echo "::error::Unsupported browser engines"; exit 1 ;;
        esac
        npm install --prefix "$RUNNER_TEMP/image-format-tests" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.63.0
        node "$RUNNER_TEMP/image-format-tests/node_modules/playwright/cli.js" install --with-deps $TEST_BROWSERS
        echo "NODE_PATH=$RUNNER_TEMP/image-format-tests/node_modules" >> "$GITHUB_ENV"
