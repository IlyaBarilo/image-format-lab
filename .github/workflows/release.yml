name: Release
run-name: Release ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag from main, for example v1, v0.1, v0.1.0 or v0.1.2.3
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-image-format-lab
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      artifact: ${{ steps.assets.outputs.artifact-id }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      IMAGE_TEST_PYTHON: python
      IMAGE_TEST_HEIC_NATIVE: '1'
      IMAGE_TEST_LOGS: test-results
      IMAGE_TEST_RUN_ID: release
    steps:
      - name: Require main workflow branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Release from the main branch."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-tests
      - name: Check publication paths and clean inputs
        run: |
          node scripts/check-repository.mjs
          npm --prefix scripts run build -- --check
      - name: Build the selected tag with its source URLs
        id: commit
        run: |
          npm --prefix scripts run build:release -- --tag="$RELEASE_TAG" --repository="$GITHUB_REPOSITORY"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run all tests against the release build
        run: npm --prefix scripts test
      - name: Verify and collect the tested assets
        run: |
          node scripts/build.mjs --release --tag="$RELEASE_TAG" --repository="$GITHUB_REPOSITORY" --check
          node scripts/package-release.mjs
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Pass tested assets to publication
        id: assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Publication code comes from the workflow commit, not the selected tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          merge-multiple: true
          path: dist/release/
      - name: Upload, verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: node scripts/publish-release.mjs
