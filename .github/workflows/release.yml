name: Release
run-name: Release ${{ github.event.release.tag_name }}
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: publish-image-format-lab
  cancel-in-progress: false
jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      artifact: ${{ steps.assets.outputs.artifact-id }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      IMAGE_TEST_PYTHON: python
      IMAGE_TEST_HEIC_NATIVE: '1'
      IMAGE_TEST_LOGS: test-results
      IMAGE_TEST_RUN_ID: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a mutable release and a version from main
        env:
          RELEASE_IMMUTABLE: ${{ github.event.release.immutable }}
        run: |
          if [ "$RELEASE_IMMUTABLE" = "true" ]; then
            echo "::error::Published immutable releases cannot accept assets."
            exit 1
          fi
          node --input-type=module -e 'import { verifyReleaseCheckout } from "./scripts/build-version.mjs"; verifyReleaseCheckout(process.env.RELEASE_TAG, process.cwd());'
      - uses: ./.github/actions/setup-tests
      - name: Check publication paths and clean inputs
        run: |
          node scripts/check-repository.mjs
          npm --prefix scripts run build -- --check
      - name: Build the selected tag with its source URLs
        id: commit
        run: |
          npm --prefix scripts run build:release -- --tag="$RELEASE_TAG" --repository="$GITHUB_REPOSITORY"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run all tests against the release build
        run: npm --prefix scripts test
      - name: Verify and collect the tested assets
        run: |
          node scripts/build.mjs --release --tag="$RELEASE_TAG" --repository="$GITHUB_REPOSITORY" --check
          node scripts/package-release.mjs
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Pass tested assets to publication
        id: assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The release event identifies the commit used by the workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          merge-multiple: true
          path: dist/release/
      - name: Attach and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: node scripts/publish-release.mjs
