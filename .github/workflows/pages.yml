name: Pages
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - scripts/prepare-pages.mjs
  workflow_run:
    workflows: [Release]
    types: [completed]
permissions: {}
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'push' || (github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - name: Prepare the verified Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-pages.mjs "$GITHUB_REPOSITORY" "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish Image Format Lab
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
